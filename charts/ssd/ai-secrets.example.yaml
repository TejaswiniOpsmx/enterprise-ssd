# ---------------------------------------------------------------------------
# !!! SECURITY WARNING !!!
# EXAMPLE with dummy values. Copy to ai-secrets.local.yaml (git-ignored), put the
# real values there and install with:
#   helm install ssd ... -f ai-secrets.local.yaml \
#     --set-file aiSecrets.claudeCredentials.json=$HOME/.claude/.credentials.json
# NEVER commit or push a file that contains real tokens or passwords.
# ---------------------------------------------------------------------------
aiSecrets:
  airemediation:
    # existingSecret: my-own-secret     # use a secret you manage; chart creates none
    model: claude-sonnet-4-6
    agent: claude_code
    oauthToken: "REPLACE_ME"
    databaseUrl: "REPLACE_ME"           # postgresql://USER:PASSWORD@ssd-db:5432/DBNAME
  pentestgpt:
    oauthToken: "REPLACE_ME"
  claudeCredentials: {}                  # pass json with --set-file (see above)
  aig:
    # existingSecret: my-aig-secret      # your own secret with key TenantApiKey; chart creates none
    tenantApiKey: "REPLACE_ME"           # must match the tenant API key configured in AI Guardian
