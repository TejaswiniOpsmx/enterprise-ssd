ssdIngress: {{.Values.global.ssdUI.protocol}}://{{.Values.global.ssdUI.host}}
detectorImage: {{ template "kubedetector.image" . }}
kubescapeImage: {{ template "kubescape.image" . }}
ssdRescheduler: http://ssd-rescheduler:8010
gotenberg: http://localhost:3000
ssdIssuer: {{ .Values.supplychainapi.ssdIssuer }}
#jwkPath: {{ .Values.supplychainapi.jwkPath }}
namespace: {{ .Release.Namespace }}
zapService: http://zap-service:8080
ssdLicenseGenerator: http://ssd-license-generator:8080
aiRemediation: http://ai-guardian-remediation:8588
{{- /* ssdVuln: URL from supplychainapi.ssdVuln (no credentials allowed there); username/password from aiSecrets are URL-encoded and the whole value is quoted so special characters cannot break or inject into the YAML */}}
{{- $vuln := default "https://ssd.oss.opsmx.net" .Values.supplychainapi.ssdVuln }}
{{- if not (regexMatch "^https?://[^@/\\s]+(/.*)?$" $vuln) }}
{{- fail "supplychainapi.ssdVuln must be an http(s) URL without embedded credentials; set aiSecrets.supplychainApi.ssdVulnUsername/ssdVulnPassword instead" }}
{{- end }}
{{- $vc := .Values.aiSecrets.supplychainApi }}
{{- if and $vc.ssdVulnUsername $vc.ssdVulnPassword }}
{{- $vuln = regexReplaceAll "^(https?://)" $vuln (printf "${1}%s:%s@" (urlquery $vc.ssdVulnUsername | replace "+" "%20") (urlquery $vc.ssdVulnPassword | replace "+" "%20")) }}
{{- end }}
ssdVuln: {{ $vuln | quote }}
aigAddress: {{ default (printf "http://ai-guardian-api.%s.svc.cluster.local:8080" .Release.Namespace) .Values.supplychainapi.aigAddress | quote }}
ssdApiMcp: {{ default "http://ssd-api-mcp:8080" .Values.supplychainapi.ssdApiMcp | quote }}
aibomService: http://aibom-service:8082
hbomGenerator: http://hbom-generator:8090
audit:
  enabled: true
tokenMachine:
    host: http://token-machine
    port: 8050
opsMxSvc: {{.Values.global.ssdUI.protocol}}://{{.Values.global.ssdUI.host}}
ssdOpa: http://ssd-opa:8200
graphqlsvc:
    {{- if .Values.dgraph.HA.enabled }}
    host: http://dgraph-alpha-public
    {{- else }}
    host: http://dgraph-public
    {{- end }}
    port: 8080
toolchain:
    host: http://tool-chain
    port: 8100
ssdNotificationService:
    host: http://ssd-notification
    port: 9091
spinnaker:
    rabbitmq:
      queue: preview-saas-ssd
      exchange: echo.events
      bindingKey: preview-saas-ssd
projectMonitor:
    host: http://project-monitor-service
    port: 9090
policy:
    repoURL: "https://github.com/OpsMx/ssd-policies.git"
    pullReferenceName: "release/2026.07"
    pullReferenceType: "branch"
    pollingTime: 120
shieldGateway:
    host: http://ssd-shield-gateway
    port: 8080
