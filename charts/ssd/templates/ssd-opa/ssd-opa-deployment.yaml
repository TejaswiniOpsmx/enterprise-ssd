apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssd-opa
  labels:
    app: ssd
    component: ssd-opa
{{ include "ssd.standard-labels" . | indent 4 }}
spec:
  replicas: {{ .Values.ssdopa.replicaCount }}
  selector:
    matchLabels:
      app: ssd
      component: ssd-opa
  template:
    metadata:
      labels:
        app: ssd
        component: ssd-opa
{{ include "ssd.standard-labels" . | indent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/ssd-opa/ssd-opa-secret.yaml") . | sha256sum }}
{{- if .Values.ssdopa.annotations -}}
        {{ toYaml .Values.ssdopa.annotations | nindent 8 }}
{{- end }}
    spec:
      {{- if .Values.global.gkeworkload }}
      serviceAccountName: ssd-workload-sa
      {{- end }}
      containers:
        - name: ssd-opa
          image: {{ template "ssdopa.image" . }}
          ports:
            - containerPort: 8200
              protocol: TCP
          env:
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: redis-secret
          - name: OAUTH_BRIDGE_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                key: oauth-private-key
                name: oauth-bridge-client-secrets
                optional: true
          envFrom:
          - configMapRef:
              name: ssd-proxy-certs
              optional: true
          - configMapRef:
              name: oauth-bridge-client-config
              optional: true
          - configMapRef:
              name: ssd-audit-emitter-config
          volumeMounts:
            - mountPath: /app/ssd-public-keys
              name: ssd-public-keys
            - mountPath: /app/secrets/
              name: ssdsecret
              readOnly: true
            - mountPath: /app/scanFiles
              name: scanfilepath
            - mountPath: /app/logs
              name: logs
            - name: ssd-opa-volume
              mountPath: /app/config/ssd-opa.yaml
              subPath: ssd-opa.yaml
            - mountPath: /usr/local/share/ca-certificates
              name: custom-certs
            - mountPath: /app/secrets/ssd-opa-token/
              name: token
              readOnly: true
            - name: service-account
              readOnly: true
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
        {{- with .Values.ssdopa.probes }}
        {{- toYaml . | nindent 10 }}
        {{- else }}
          livenessProbe:
            failureThreshold: 20
            httpGet:
              path: /health
              port: 8200
              scheme: HTTP
            periodSeconds: 15
            initialDelaySeconds: 30
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 20
            httpGet:
              path: /health
              port: 8200
              scheme: HTTP
            periodSeconds: 15
            initialDelaySeconds: 30
            successThreshold: 1
            timeoutSeconds: 1
        {{- end }}
      {{- with .Values.ssdopa.resources }}
          resources:
      {{- toYaml . | nindent 12 }}
      {{- end }}
          securityContext:
      {{- if .Values.ssdopa.securityContext }}
      {{ toYaml .Values.ssdopa.securityContext | nindent 12 }}
      {{- else }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
      {{- end }}
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
      - name: {{ .Values.imagePullSecret }}
      {{- end }}
{{ include "otel.sidecar.container" . | indent 8 }}
      volumes:
        - configMap:
            defaultMode: 420
            name: ssd-public-keys
          name: ssd-public-keys
        - name: ssdsecret
          secret:
            defaultMode: 420
            items:
            - key: AESEncryptionKey
              path: ssdsecret/AESEncryptionKey
            secretName: ssdsecret
        - emptyDir: {}
          name: scanfilepath
        - emptyDir: {}
          name: logs
        - name: token
          secret:
            defaultMode: 420
            secretName: ssd-opa-token
        - name: ssd-opa-volume
          secret:
            secretName: ssd-opa
            items:
              - key: ssd-opa.yaml
                path: ssd-opa.yaml
            defaultMode: 420
        - name: ssd-proxy-certs
          configMap:
            defaultMode: 420
            optional: true
            name: ssd-proxy-certs
        - name: custom-certs  # Optional: In case we are using any customer-specific custom CAs
          configMap:
            defaultMode: 420
            items:
            - key: ca.crt
              path: ca.crt
            optional: true
            name: customer-custon-ca
        - name: otel-sidecar-volume
          configMap:
            name: otel-sidecar-config
            defaultMode: 420
        - name: service-account
          projected:
            sources:
              - serviceAccountToken:
                  audience: ssdopsmxadmin
                  expirationSeconds: 3600
                  path: token
            defaultMode: 420
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}


